<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styles/index.css">
    <link rel="stylesheet" href="../styles/modal.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <title>Ticketero</title>
</head>
<body>
    <header>
        <nav>
            <div class="navbar-left">
                <img src="" alt="Logo de la empresa">
            </div>
            <div class="navbar-right">
                <p>user@example.com</p>
                <img class="notification" src="../assets/notification.png" alt="logo de notificaciones">
                <img class="user-photo" src="../assets/gege gato gojo.jpeg" alt="logo de usuario">
            </div>
        </nav>
    </header>
    <main>

        <h1>MIS TICKETS</h1>
        <section class="main-container">
            
            <div class="cards-container">
                <!-- Maquetacion por medio de script JS -->
            </div>

            <section class="container-modal">
                <div id="modalEdit" class="modal">
                    <div class="modal-content">
                        <h2>Editar Ticket</h2>
                        <div id="editFormContainer"></div>
                        
                    </div>
                    <div class="button-containerEdit">
                        <button class="close">Cerrar</button>
                        <button id="updateButton">Actualizar</button>
                    </div>
                </div>
            </section>

        </section>

        <button class="newPetition" type="button">
            <img src="../assets/add.png">
            Nueva petición 
        </button>

        <section class="container-modal">
            <div id="myModal" class="myModal">
                <div class="modal-C">
                    <h2>Crear Ticket</h2>
                    <div id="formContainerNew">
                        <!--Maquetacion de modalCreate en js-->
                    </div>
                    <div class="button-container">
                        <button id="cancelButton">Cancelar</button>
                        <button id="submitButton">Enviar</button>
                    </div>
                </div>
                </div>
        </section>
        
        
        

    </main>
        
    <footer></footer>    
</body>
    <script type="module" src="../scripts/tickets.js"></script>
    <script src="../scripts/modalCreate.js"></script>
    <script type="module" src="../scripts/modalEdit.js"></script>
