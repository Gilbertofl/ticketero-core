<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="../styles/index.css">
        <link rel="stylesheet" href="../styles/indexDis.css">
        <link rel="stylesheet" href="../styles/modal.css">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
        <title>Ticketero</title>
    </head>
<body>
    <header>
        <nav>
            <div class="navbar-left">
                <img src="" alt="Logo de la empresa">
            </div>
            <div class="navbar-right">
                <p class="user-email"></p>
                <!-- <img class="notification" src="../assets/notification.png" alt="logo de notificaciones"> -->
                <div class="dropdown">
                    <img class="user-photo" src="../assets/gege gato gojo.jpeg" alt="logo de usuario" onclick="toggleDropdown()">
                    <div class="dropdown-content" id="dropdownContent">
                        <a onclick="logout()">Cerrar sesión</a>
                    </div>
                </div>
            </div>
        </nav>
    </header>
    <main>
        <section class="dispo-container">
            <h2>Tickets Disponibles</h2>
            <div class="cards-container">
                <!-- Maquetacion por medio de script JS -->
            </div>
            <section class="container-modal">
                <div id="modalEdit" class="myModal">
                    <div class="modal-C">
                        <h2>Editar Ticket</h2>
                        <div id="editFormContainer">

                        </div>
                        <div class="button-containerEdit">
                            <button class="close">Cerrar</button>
                            <button id="updateButton">Actualizar</button>
                        </div>
                    </div>
                    
                </div>
            </section>
        </section>
        <section class="active-container">
            <h2>Tickets Activos</h2>
            <div class="cards-container">
                <!-- Maquetacion por medio de script JS -->
            </div>
            <section class="container-modal">
                <div id="modalEdit" class="myModal">
                    <div class="modal-C">
                        <h2>Editar Ticket</h2>
                        <div id="editFormContainer">

                        </div>
                        <div class="button-containerEdit">
                            <button class="close">Cerrar</button>
                            <button id="updateButton">Actualizar</button>
                        </div>
                    </div>
                    
                </div>
            </section>
            
        </section>
    </main>
</body>
    <script src="../scripts/basic.js"></script>

</html>
