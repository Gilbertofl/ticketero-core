services:
  # Base de Datos PostgreSQL con carga automática de datos iniciales
  postgres:
    image: postgres:16-alpine
    container_name: ticketero-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ticketero
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./api/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ticketero"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Backend Node.js API + Portal Web Integrado
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: ticketero-api
    restart: unless-stopped
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ticketero
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./api/uploads:/app/api/uploads

volumes:
  postgres_data:
