<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/index.css">
    <link rel="stylesheet" href="../css/modal.css">
    <title>Ticketero - Panel de Soporte</title>
</head>
<body data-view="SOPORTE">
    <header>
        <nav>
            <div class="navbar-left">
                <span class="brand-title">Ticketero</span>
                <span class="user-role-badge" id="userRoleBadge">SOPORTE</span>
            </div>
            <div class="navbar-right">
                <!-- Campana de Notificaciones SSE en tiempo real -->
                <div class="notification-container">
                    <button type="button" class="notification-bell-btn" id="notificationBellBtn" aria-label="Notificaciones">
                        <img class="notification-icon" src="../assets/notification.png" alt="Notificaciones">
                        <span class="notification-badge" id="notificationBadge">0</span>
                    </button>
                    <div class="notification-dropdown" id="notificationDropdown">
                        <div class="notification-dropdown-header">
                            <span>Notificaciones en Vivo</span>
                        </div>
                        <ul class="notification-list" id="notificationList">
                            <li class="notification-empty">No hay notificaciones nuevas</li>
                        </ul>
                    </div>
                </div>

                <p class="user-email" id="userEmailDisplay"></p>
                <div class="dropdown">
                    <img class="user-photo" id="userMenuButton" src="../assets/gege gato gojo.jpeg" alt="Foto de usuario">
                    <div class="dropdown-content" id="dropdownContent">
                        <button type="button" id="logoutButton">Cerrar sesión</button>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <!-- Contenedor Flotante de Toasts en Pantalla -->
    <div class="toast-container" id="toastContainer"></div>

    <main>
        <div class="page-header">
            <h1>Panel de Control de Soporte</h1>
        </div>

        <!-- Barra de filtro de fecha y paginación -->
        <section class="filter-bar">
            <div class="filter-left">
                <div class="filter-group">
                    <label for="filterDateInput">Fecha:</label>
                    <input type="date" id="filterDateInput">
                </div>
                <button type="button" class="btn-filter active" id="filterTodayBtn">Solo Hoy</button>
                <button type="button" class="btn-filter" id="filterAllDatesBtn">Histórico</button>
            </div>
            <div class="filter-right">
                <div class="pagination-controls">
                    <button type="button" id="prevPageBtn">Anterior</button>
                    <span class="pagination-info" id="paginationInfo">Cargando...</span>
                    <button type="button" id="nextPageBtn">Siguiente</button>
                </div>
            </div>
        </section>

        <section class="section-block">
            <h2>Tickets Abiertos por Atender</h2>
            <div class="cards-container" id="availableTicketsContainer"></div>
        </section>

        <section class="section-block">
            <h2>Tickets Activos y Resueltos</h2>
            <div class="cards-container" id="activeTicketsContainer"></div>
        </section>

        <!-- ControlesModal de paginación -->
        <section class="pagination-controls">
            <button type="button" id="prevPageBtn">Anterior</button>
            <span class="pagination-info" id="paginationInfo">Cargando...</span>
            <button type="button" id="nextPageBtn">Siguiente</button>
        </section>

        <!-- Modal únicoúnico multipropósito -->
        <section class="container-modal">
            <div id="ticketModal" class="myModal" role="dialog" aria-modal="true">
                <div class="modal-C">
                    <h2 id="modalTitle">Gestionar Ticket</h2>
                    <div id="modalFormContainer"></div>
                </div>
            </div>
        </section>

        <!-- Lightbox Modal para ampliar fotos adjuntas -->
        <div id="lightboxModal" class="lightbox-modal">
            <span class="lightbox-close" id="lightboxClose">&times;</span>
            <img class="lightbox-content" id="lightboxImage" src="" alt="Foto en tamaño completo">
        </div>
    </main>

    <script type="module" src="../js/auth.js"></script>
    <script type="module" src="../js/tickets.js"></script>
</body>
</html>
